# Local dev infra for Logimart ERP.
# Only Postgres is required: the app uses no Redis, and stores uploads (POD
# photos / labels) in Postgres — so no object store is needed either.
services:
  postgres:
    image: postgres:16-alpine
    container_name: logimart-erp-postgres
    environment:
      POSTGRES_USER: logimart
      POSTGRES_PASSWORD: logimart
      POSTGRES_DB: logimart_erp
    ports:
      - "5432:5432"
    volumes:
      - logimart_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logimart -d logimart_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  logimart_pg:
