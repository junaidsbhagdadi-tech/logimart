# Logimart ERP — nginx reverse proxy.  Copied to /etc/nginx/sites-available/logimart
# by server-setup.sh. certbot adds the TLS (443) server block automatically.
server {
    listen 80;
    server_name erp.logimart.co.in;

    # POD images / labels are streamed through the API as data-URIs.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
