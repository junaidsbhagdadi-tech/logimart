# DigitalOcean App Platform spec for the Logimart ERP UAT environment.
# Separate app from production: tracks the `uat` branch, uses the `uat` database
# (same cluster, isolated data), and its own subdomain uat.logimart.com.
# Real DATABASE_URL / JWT_SECRET are set in the DO dashboard, not committed here.
name: logimart-uat
region: blr
domains:
- domain: uat.logimart.com
  type: PRIMARY
services:
- name: logimart-erp
  environment_slug: node-js
  github:
    repo: junaidsbhagdadi-tech/logimart-erp
    branch: uat                 # <-- UAT tracks the uat branch
    deploy_on_push: true
  build_command: npm run build
  run_command: npm start
  http_port: 8080
  instance_count: 1             # 1 container is plenty for UAT (saves cost + DB connections)
  instance_size_slug: apps-s-1vcpu-1gb
  health_check:
    http_path: /health
  envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_DASHBOARD_uat_database_connection_string
  - key: JWT_SECRET
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_DASHBOARD
  - key: VOLUMETRIC_DIVISOR
    scope: RUN_AND_BUILD_TIME
    value: "5000"
  - key: COMPANY_GSTIN
    scope: RUN_TIME
    value: "TODO_LOGIMART_GSTIN"
  - key: COMPANY_STATE_CODE
    scope: RUN_TIME
    value: "29"
  - key: NODE_ENV
    scope: RUN_AND_BUILD_TIME
    value: production
