name: logimart_scanner
description: Logimart rider app â€” pickups, deliveries (POD), quick booking and offline scanning.
publish_to: "none"
version: 1.3.1+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  mobile_scanner: ^7.4.2      # camera barcode scanning (ML Kit under the hood)
  uuid: ^4.5.1                # client_event_id for idempotency
  sqflite: ^2.3.3            # offline write-ahead queue
  path: ^1.9.0
  shared_preferences: ^2.3.2 # token storage
  connectivity_plus: ^6.0.5  # auto-sync when network returns
  image_picker: ^1.1.2       # POD photo from the camera
  url_launcher: ^6.3.0       # call consignee / open map
  flutter_inappwebview: ^6.2.0-beta.3 # in-app print of the web AWB / label / manifest pages

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon.png
