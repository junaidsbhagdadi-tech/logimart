<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d3a8c" /><title>Offline · ExcelEx</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f7fc; --card:#fff; --text:#13203a; --muted:#5a6680; --brand:#1565c0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1626; --card:#16213a; --text:#e8eefc; --muted:#9fb0d0; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; box-sizing:border-box; }
  .card { background:var(--card); border-radius:18px; padding:28px 24px; max-width:360px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.08); }
  img { width:72px; height:72px; border-radius:16px; }
  h1 { font-size:20px; margin:14px 0 6px; } p { color:var(--muted); font-size:15px; line-height:1.5; margin:0 0 18px; }
  button { background:var(--brand); color:#fff; border:0; border-radius:12px; padding:12px 22px; font-size:15px; font-weight:600; width:100%; }
</style></head>
<body><div class="card"><img src="/icons/icon-192.png" alt="ExcelEx" /><h1>You're offline</h1>
<p>ExcelEx needs the internet to show live shipments. Check your mobile data or Wi-Fi, then try again.</p>
<button onclick="location.reload()">Try again</button></div>
<script>window.addEventListener('online', () => location.reload());</script></body></html>
