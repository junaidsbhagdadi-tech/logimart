name: keep-alive

# Pings the Render free web service so it never idles into hibernation.
# Free-tier services sleep after 15 min idle; the wake path is what throws
# `hibernate-wake-error`. Keeping it warm avoids that path entirely.
#
# Note: GitHub-hosted cron is best-effort and can be delayed under load, so the
# interval is set tighter than the 15-min idle window to leave margin. GitHub also
# pauses scheduled workflows after 60 days of repo inactivity — a manual run
# (workflow_dispatch) or any push re-arms it.

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch: {}        # allow a manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          URL="https://logimart-erp.onrender.com/health"
          # Retry a few times: if the instance was asleep, the first hit wakes it.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$URL" || echo 000)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "awake"
              exit 0
            fi
            sleep 20
          done
          echo "still not healthy after retries"
          exit 1
