# Render Blueprint — free UAT for Logimart ERP.
# One free web service (API + portal, single service) + one free Postgres.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render reads this file.
#
# Free-tier notes:
#  - Web service sleeps after 15 min idle -> ~40s cold start on the next hit (fine for UAT).
#  - 512 MB RAM: NODE_OPTIONS below caps V8 so the build/runtime stays under the limit.
#  - Free Postgres is temporary (expires ~30 days) — perfect for a few days of testing.
#  - Seeding: Render's free plan has no shell, so seed once from your machine against the
#    DB's EXTERNAL connection string (see DEPLOY-UAT.md).

services:
  - type: web
    name: logimart-erp
    runtime: node
    plan: free
    region: singapore          # closest free region to India (also: oregon, frankfurt, ohio, virginia)
    branch: main
    buildCommand: npm run build # includes `prisma db push` (schema sync happens at build, not on every wake)
    startCommand: npm start     # node dist/main.js only — fast boot so free-tier hibernate-wake never times out
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=460   # keep under the 512 MB free limit
      - key: JWT_SECRET
        generateValue: true               # Render generates a strong random secret
      - key: VOLUMETRIC_DIVISOR
        value: "5000"
      - key: COMPANY_GSTIN
        value: TODO_LOGIMART_GSTIN         # set Logimart's real GSTIN in the dashboard
      - key: COMPANY_STATE_CODE
        value: "29"
      - key: DATABASE_URL
        fromDatabase:
          name: logimart-db
          property: connectionString

databases:
  - name: logimart-db
    plan: free
    databaseName: logimart_erp
    user: logimart
    region: singapore
